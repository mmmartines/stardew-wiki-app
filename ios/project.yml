# Projeto do app iOS, gerado com XcodeGen (o .xcodeproj não fica no repositório).
# Gerar:  cd ios && xcodegen generate
name: GuiaDoVale
options:
  bundleIdPrefix: io.github.mmmartines
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  GuiaDoVale:
    type: application
    platform: iOS
    sources:
      - path: GuiaDoVale
      # arquivos compartilhados com o Android: formatação das páginas, títulos do menu e fontes
      - path: ../android/app/src/main/assets/article.js
        buildPhase: resources
      - path: ../android/app/src/main/assets/article.css
        buildPhase: resources
      - path: ../android/app/src/main/assets/titles.json
        buildPhase: resources
      - path: ../android/app/src/main/assets/terms.json
        buildPhase: resources
      - path: ../android/app/src/main/assets/fonts/pixelify-sans-latin-400-normal.woff2
        buildPhase: resources
      - path: ../android/app/src/main/assets/fonts/pixelify-sans-latin-700-normal.woff2
        buildPhase: resources
      - path: ../android/app/src/main/res/font/pixel.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mmmartines.guiadovale
        PRODUCT_NAME: GuiaDoVale
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Valley Guide"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.reference"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone sempre em pé; iPad gira livremente (exigência da Apple para multitarefa)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        # tradução automática (framework Translation, iOS 18+): ligação fraca para abrir também no iOS 16/17
        OTHER_LDFLAGS: "$(inherited) -weak_framework Translation"
    info:
      path: GuiaDoVale/Info.plist
      properties:
        UIAppFonts: [pixel.ttf]
        CFBundleLocalizations: [en, pt, es, fr, de, it, hu, ru, tr, ja, ko, zh-Hans]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen:
          UIColorName: AccentColor
