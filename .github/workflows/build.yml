name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: StardewWikiPT-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar APK no branch "apk"
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/StardewWikiPT.apk
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add StardewWikiPT.apk
          git commit -qm "APK de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
      - name: Publicar log de erro
        if: failure()
        run: |
          mkdir -p /tmp/l && grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > /tmp/l/erro.txt || true
          tail -60 build.log >> /tmp/l/erro.txt
          cd /tmp/l && git init -q -b log && git config user.name a && git config user.email a@b.c && git add . && git commit -qm log
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" log
