name: Gerar iOS (mods)

# Compila o app iOS num Mac do GitHub (grátis em repositório público), roda no simulador
# e tira prints das telas principais para conferência. Ainda não assina nem envia para a Apple.
on:
  push:
    branches: [mods]
    paths:
      - 'ios/**'
      - 'android/app/src/main/assets/**'
      - 'android/app/src/main/res/values*/strings.xml'
      - '.github/workflows/ios-mods.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Gerar textos e projeto
        run: |
          python3 ios/scripts/gen_strings.py
          cd ios && xcodegen generate

      - name: Escolher simulador
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              v=tuple(int(x) for x in re.findall(r"\d+", rt.split("iOS")[-1])[:2])
              for x in devs:
                  n=x["name"]
                  if n.startswith("iPhone") and "Max" not in n and "Plus" not in n and "SE" not in n:
                      k=(v, "Pro" not in n, n)
                      if best is None or k>best[0]: best=(k,x["udid"],n)
          print(best[1]); print(best[2], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Compilar
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project GuiaDoVale.xcodeproj -scheme GuiaDoVale -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*GuiaDoVale|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Rodar no simulador e tirar prints
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=ios/build/Build/Products/Debug-iphonesimulator/GuiaDoVale.app
          BID=io.github.mmmartines.guiadovale
          mkdir -p shots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          shot() { # nome, espera, argumentos...
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" $BID 2>/dev/null || true
            xcrun simctl launch "$UDID" $BID "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 01-inicio-jogo-base 14 -lang pt -screen home -src base
          shot 02-inicio-sunberry 14 -lang pt -screen home -src sbv
          shot 03-inicio-eastscarp 30 -lang pt -screen home -src esc
          shot 04-meus-mods 14 -lang pt -screen home -src base
          shot 05-busca-global-maia 18 -lang pt -screen search -q Maia -src base
          shot 06-busca-global-parsnip 18 -lang pt -screen search -q Parsnip -src base
          shot 07-artigo-eastscarp 40 -lang pt -screen article -page Villagers -src esc
          shot 08-artigo-sunberry-maia 30 -lang pt -screen article -page Maia -src sbv
          shot 09-artigo-base-abigail 16 -lang pt -screen article -page Abigail -src base
          shot 10-favoritos-misturados 8 -lang pt -screen favorites -page Abigail -src base
          xcrun simctl ui "$UDID" appearance dark
          shot 11-inicio-sunberry-escuro 14 -lang pt -screen home -src sbv
          shot 12-artigo-sunberry-escuro 16 -lang pt -screen article -page Maia -src sbv
          xcrun simctl list runtimes > shots/runtimes.txt 2>&1 || true
          xcrun simctl spawn "$UDID" log show --last 20m --predicate 'process == "GuiaDoVale"' --style compact > shots/app-log.txt 2>/dev/null || true

      - name: Guardar prints (arquivo do build, não público)
        if: always()
        run: |
          mkdir -p shots && cp ios/build.log shots/build.log 2>/dev/null || true
          grep -E "error:" -A3 ios/build.log > shots/erros.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shots-mods
          path: shots
          retention-days: 7
