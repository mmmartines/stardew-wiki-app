name: Gerar APK (mods)

# Só para o branch "mods": gera o APK de teste (guardado como arquivo do build, não público).
# Não gera o pacote da loja e não mexe no branch "apk" da versão em produção.
on:
  push:
    branches: [mods]
    paths:
      - 'android/**'
      - '.github/workflows/build-mods.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de teste
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      # o APK de teste dos mods não fica público: só como arquivo do build (precisa entrar no GitHub), por 7 dias
      - uses: actions/upload-artifact@v4
        with:
          name: apk-mods
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publicar log de erro
        if: failure()
        run: |
          mkdir -p /tmp/l && grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > /tmp/l/erro.txt || true
          tail -60 build.log >> /tmp/l/erro.txt
          cd /tmp/l && git init -q -b log-mods && git config user.name a && git config user.email a@b.c && git add . && git commit -qm log
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" log-mods

  # Roda o APK num emulador Android e tira prints das telas novas (guardados como arquivo do build, não públicos).
  shots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-mods
          path: android
      - name: Ligar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Prints no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: bash scripts/shots.sh
      - name: Guardar prints (arquivo do build, não público)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-shots-mods
          path: android/shots
          retention-days: 7
