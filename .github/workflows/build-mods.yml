name: Gerar APK (mods)

# Só para o branch "mods": gera o APK de teste e publica no branch "apk-mods".
# Não gera o pacote da loja e não mexe no branch "apk" da versão em produção.
on:
  push:
    branches: [mods]
    paths:
      - 'android/**'
      - '.github/workflows/build-mods.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de teste
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: apk-mods
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK no branch "apk-mods"
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/GuiaDoVale-mods-teste.apk
          cd /tmp/out
          git init -q -b apk-mods
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Build mods de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-mods

      - name: Publicar log de erro
        if: failure()
        run: |
          mkdir -p /tmp/l && grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > /tmp/l/erro.txt || true
          tail -60 build.log >> /tmp/l/erro.txt
          cd /tmp/l && git init -q -b log-mods && git config user.name a && git config user.email a@b.c && git add . && git commit -qm log
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" log-mods

  # Roda o APK num emulador Android e tira prints das telas novas (publicados no branch "android-shots-mods").
  shots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-mods
          path: android
      - name: Ligar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Prints no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: bash scripts/shots.sh
      - name: Publicar prints
        if: always()
        run: |
          mkdir -p /tmp/s && cp -R android/shots/. /tmp/s/ 2>/dev/null || true
          cd /tmp/s && git init -q -b android-shots-mods
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Prints mods ${GITHUB_SHA::7}" --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-shots-mods
