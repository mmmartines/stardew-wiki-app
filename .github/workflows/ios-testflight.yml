name: Enviar iOS para o TestFlight

# Assina o app iOS na nuvem da Apple e envia para o App Store Connect (TestFlight), sem precisar de Mac.
# Roda sob demanda (aba Actions → "Enviar iOS para o TestFlight" → Run workflow).
# Precisa destes Secrets do repositório:
#   APPLE_TEAM_ID        – Team ID da conta de desenvolvedor (10 letras/números)
#   APPSTORE_KEY_ID      – Key ID da chave de API do App Store Connect
#   APPSTORE_ISSUER_ID   – Issuer ID da mesma tela
#   APPSTORE_KEY_P8      – conteúdo do arquivo AuthKey_XXXX.p8 (texto inteiro, com BEGIN/END)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (a mesma do Android)'
        default: '1.7.1'
        required: true

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os Secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.APPSTORE_KEY_ID }}
          ISS: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          for v in TEAM KID ISS P8; do
            if [ -z "${!v}" ]; then echo "::error::Falta o Secret $v (veja o topo deste arquivo)"; exit 1; fi
          done

      - name: Ferramentas e projeto
        run: |
          brew install xcodegen
          xcodebuild -version
          python3 ios/scripts/gen_strings.py
          cd ios && xcodegen generate

      - name: Chave de API
        env:
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Gerar o arquivo (archive)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.APPSTORE_KEY_ID }}
          ISS: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          cd ios
          xcodebuild archive -project GuiaDoVale.xcodeproj -scheme GuiaDoVale -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/GuiaDoVale.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            2>&1 | tee archive.log | grep -E "error:|ARCHIVE|Signing" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Assinar e enviar para o App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.APPSTORE_KEY_ID }}
          ISS: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GuiaDoVale.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            2>&1 | tee export.log | grep -E "error:|EXPORT|Upload|upload" || true
          grep -q "EXPORT SUCCEEDED" export.log

      - name: Apagar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Guardar os registros (se der erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registros-testflight
          path: |
            ios/archive.log
            export.log
