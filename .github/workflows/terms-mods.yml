name: Gerar termos da wiki (mods)

# Gera assets/terms.json (termos da wiki oficial em cada idioma) e grava no branch "mods".
on:
  push:
    branches: [mods]
    paths:
      - 'tools/gen_terms.py'
      - '.github/workflows/terms-mods.yml'

permissions:
  contents: write

jobs:
  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Gerar
        run: python3 tools/gen_terms.py
      - name: Gravar no branch mods
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add android/app/src/main/assets/terms.json
          git commit -m "Termos da wiki oficial (gerado)" || exit 0
          git pull --rebase origin mods && git push origin HEAD:mods
